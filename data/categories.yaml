- id: B-C-1
  model: Model B
  l1: INJ 注入与执行
  leaf: 系统提示词泄露公开
  leaf_en: System prompt disclosure
  definition: 攻击者通过注入/越狱诱导 AI 吐出系统提示词，再借分享链接把提取过程与提示词原文公开。（如：贴出 “You are…” 系统指令、内部规则、工具定义清单）｜识别信号：正文含疑似平台系统提示片段或其逐步提取过程。
  source_refs: OWASP LLM07:2025 System Prompt Leakage
  detection_methods: 【静态】系统提示指纹库匹配（"You are…"句式、平台规则模板、工具 schema 结构）+ 逐步提取话术模式（“重复以上/打印你的指令”）；【LLM】判定片段是否为系统提示成分及其提取语境（跨语种）。
  tracks:
  - static
  - llm
  status: phase2_llm
  note: ''
  kevin_note: null
- id: B-C-2
  model: Model B
  l1: DIS 泄露与收割
  leaf: 外链资源追踪（去匿名查看者）
  leaf_en: External resource tracking (viewer de-anonymization)
  definition: 攻击者在分享内容嵌入指向自有服务器的外链资源，查看者或摘要 Agent 一加载即被动发起请求，泄露其 IP、UA、时间、Referer 以去匿名“谁看了链接”。（如：![](https://attacker/px.png)、远程
    CSS/字体、1×1 追踪像素）｜识别信号：正文含指向第三方主机、随打开自动加载的资源。
  source_refs: CWE-200
  detection_methods: 【静态】解析全部资源引用（img/CSS/字体）→ 域名信誉与新近注册检测；【动态】隔离沙箱渲染分享内容，枚举自动发起的出站请求（禁脚本副作用，仅记录）；【LLM】判定资源与对话主题无关性（追踪意图）。
  tracks:
  - static
  - dynamic
  - llm
  status: implemented
  note: ''
  kevin_note: null
- id: B-C-3
  model: Model B
  l1: DIS 泄露与收割
  leaf: 公开分享页模型蒸馏/抽取
  leaf_en: Model distillation/extraction via public shares
  definition: 攻击者规模化爬取公开分享页里的“提示→完整回答”配对，构建蒸馏/微调数据集以低成本克隆平台专有模型的能力、风格与对齐。（如：批量抓取高质量问答对作监督样本、聚合成可复现模型行为的训练集）｜识别信号（元数据层）：同源大量高质量
    I/O 对被外部异常规模化抓取。
  source_refs: Tramèr USENIX 2016; MITRE ATLAS AML.T0024
  detection_methods: 【平台方】访问日志异常检测（单源高频抓取、遍历式拉取、无 UI 行为的 API 化访问）——第三方不可观测；【LLM】我方仅能识别内容“高质量 I/O 对”属性（可蒸馏性），无法检测攻击行为本身。
  tracks:
  - platform
  - llm
  status: skipped
  note: No detectable feature; paper story only, not labeled
  kevin_note: 没有可行的检测特征。因此这个可以作为我们论文故事的一部分，但是不用实际标注（理论上所有帖子都会有这个安全隐患）
- id: B-C-4
  model: Model B
  l1: DIS 泄露与收割
  leaf: 预览触发 SSRF（读内网/云元数据）
  leaf_en: Preview-triggered SSRF
  definition: 分享内容含指向内部目标的 URL，平台为生成预览卡片/缩略图在服务端主动抓取时被诱导访问内网/云元数据并回传。（如：http://169.254.169.254/ 云元数据、localhost 管理端口、内网服务 URL）｜识别信号：内容或
    OG 标签含内网地址/云元数据端点。
  source_refs: CWE-918; OWASP A10:2021
  detection_methods: 【静态】URL/OG 标签提取 + 内网地址与云元数据端点模式匹配（169.254.169.254、metadata.google、localhost、私网段）；【LLM】判定 URL 在语境中构成 SSRF
    诱导（vs 讨论 SSRF 的教学内容）。
  tracks:
  - static
  - llm
  status: implemented
  note: ''
  kevin_note: null
- id: B-C-5
  model: Model B
  l1: INJ 注入与执行
  leaf: XML 外部实体注入（XXE）
  leaf_en: XML external entity injection (XXE)
  definition: 分享内容含 SVG/XML/OOXML/RSS，平台服务端解析生成预览/可搜索文本时若未禁用外部实体，则读取本地文件或发起带外请求。（如：<!DOCTYPE foo [<!ENTITY x SYSTEM 'file:///etc/passwd'>]>、参数实体+外链
    DTD）｜识别信号：XML 原始字节含 DOCTYPE/ENTITY/SYSTEM 与 file://。
  source_refs: CWE-611
  detection_methods: 【静态】XML/SVG 原始字节扫描 DOCTYPE/ENTITY/SYSTEM/file://；【LLM】判定实体结构是否具攻击指向（vs 正常 DTD/教学示例）；实体展开行为发生在平台解析器内，执行侧观测属【平台方】。
  tracks:
  - static
  - llm
  - platform
  status: implemented
  note: Payload lives in raw bytes; static scan detects it
  kevin_note: 这里的攻击载荷就写在 SVG/XML 的原始字节里，扫一遍字节就能发现。只要数据存的是原始文件字节理论上就可以检测。
- id: B-C-6
  model: Model B
  l1: SCH 侧信道与推断
  leaf: 跨站泄漏侧信道（XS-Leaks）
  leaf_en: Cross-site leaks (XS-Leaks)
  definition: 攻击者在分享页嵌入指向第三方已鉴权端点的跨源资源并布置可观测探针，查看者打开即带凭证请求，据副作用差分推断其在别处的私密状态。（如：onload/onerror 差异、加载耗时、iframe 帧计数、CSP 违规上报数）｜识别信号：内容含跨源资源加载+可测量副作用探针结构。
