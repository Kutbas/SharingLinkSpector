categories:
- id: A-C-1
  model: Model A
  l1: 自泄露（按数据类别）
  leaf: 身份标识泄露
  leaf_en: Identity information disclosure
  definition: 用户因疏忽在对话中写入并分享可直接定位自然人的直接标识符，随分享链接暴露给任意 URL 持有者。（如：真实姓名、身份证/护照号、邮箱、电话、住址、病历号/案件号）｜识别信号：正文出现姓名与联系方式/证件号的可关联组合。
  source_refs: NIST SP 800-122; GDPR Art.9
  detection_methods: 【静态】NER 识别人名/组织 + 正则匹配证件号/电话/邮箱/住址格式；【LLM】跨语种语义判定“可直接定位自然人的标识组合”（姓名×字段共现关联），弥补规则在非中英文语种的遗漏。
  tracks:
  - static
  - llm
  status: implemented
  note: ''
  kevin_note: null
  llm:
    prompt: 'You are a security risk annotator for AI conversation sharing links. Determine whether the conversation below
      exhibits the risk category "Identity information disclosure".


      ## Category definition

      用户因疏忽在对话中写入并分享可直接定位自然人的直接标识符，随分享链接暴露给任意 URL 持有者。（如：真实姓名、身份证/护照号、邮箱、电话、住址、病历号/案件号）｜识别信号：正文出现姓名与联系方式/证件号的可关联组合。

      ## Detection guidance (from taxonomy)

      跨语种语义判定“可直接定位自然人的标识组合”（姓名×字段共现关联），弥补规则在非中英文语种的遗漏。


      ## Judging requirements

      1. Judge only from the conversation content itself; make no network requests.

      2. Distinguish a real risk from teaching/discussion/example contexts (discussing the risk is NOT exhibiting the risk).

      3. The conversation may be in any language (Chinese/English/other).

      4. If suspicious signs exist but cannot be confirmed, set hit=true with confidence<=0.5.

      5. Output strict JSON only: {"hit": bool, "confidence": 0-1, "evidence": "verbatim key excerpt (<=200 chars, original
      language)", "reasoning": "judgment rationale (English, <=150 words)"}'
    needs_review: false
