- id: B-CIA-6
  model: Model B
  l1: INJ 注入与执行
  leaf: 分享页服务端模板注入（SSTI）
  leaf_en: Server-side template injection (SSTI)
  definition: 平台用服务端模板引擎拼装分享页时若把攻击者可控的标题/正文直接拼进模板字符串，模板元语法被服务端求值，可提权至读环境变量/配置(C)、篡改渲染(I)直至 RCE(A)。（如：{{7*7}}、${...}、<%= %>、#{...}）｜识别信号：内容含模板引擎元语法且被回显/求值。
  source_refs: CWE-1336
  detection_methods: 【静态】模板元语法检测（{{}}、${}、<% %>、#{}）；【LLM】辅助区分教学展示 vs 注入尝试；【平台方】真实服务端求值验证——第三方主动探测平台渲染属攻击行为。
  tracks:
  - static
  - llm
  - platform
  status: candidate
  note: Template meta-syntax candidates, high FP rate -> manual review
  kevin_note: 可以识别候选，但是很容易有误报。具体识别得通过人工核验，难度比较高。
