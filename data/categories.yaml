  leaf_en: Terminal ANSI escape injection
  definition: 分享内容嵌入 ANSI/OSC 终端转义序列，浏览器不可见，但查看者/Agent 把输出经 cat/复制/管道送入终端时被解释。（如：OSC 52 读写系统剪贴板(C/I)、擦行把恶意命令挪出可见滚动区(I)、畸形序列命中终端模拟器
    RCE(CIA)）｜识别信号：文本含 ESC[ / OSC 52 等转义控制字节。
  source_refs: CWE-150
  detection_methods: 【静态】转义控制字节扫描（ESC[、OSC 52、C1 控制符）——确定性检测；【LLM】仅辅助判定序列组合的攻击意图（普通终端输出 vs 构造性注入）。
