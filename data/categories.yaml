  definition: 平台把分享工件设计为可回流的结构化归档，“继续对话/导入项目”解析会话 JSON/序列化状态时，攻击者在可控字段塞入类型标签/多态占位触发未预期对象构造，提权至 RCE。（如：__type/$type、可实例化类名、指向内部处理器的回调）｜识别信号：序列化字段含类型标签/魔法键/可实例化类名。
  source_refs: CWE-502; OWASP A08:2021
  detection_methods: 【静态】序列化字段类型标签/魔法键检测（__type、$type、__reduce__、可实例化类名）；【平台方】实际对象构造触发发生在“导入/继续对话”服务端链路——第三方不可观测。
